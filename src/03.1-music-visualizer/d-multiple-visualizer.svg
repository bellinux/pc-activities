<svg width="1255" height="701" viewBox="0 0 1255 701" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    "Tanti modi di visualizzare": energia, luce e ripetizione entrano nel
    telefono, i tre colori primari si mescolano, e ne esce luce bianca.
    Ridisegnato in vettoriale al posto di una copia raster da 582 KB.

    Le sovrapposizioni dei tre cerchi RGB sono lenti calcolate e dipinte una a
    una (rosso+verde=giallo, rosso+blu=magenta, verde+blu=ciano, centro bianco):
    niente blend mode, che librsvg non applica fra fratelli, e la mescolanza
    additiva - che e' esattamente cio' che la lezione insegna - resta identica
    in ogni lettore.
  -->
  <defs>
    <radialGradient id="mv-light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mv-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mv-screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4066"/>
      <stop offset="1" stop-color="#122C4B"/>
    </linearGradient>
    <clipPath id="mv-screenclip"><rect x="540" y="158" width="176" height="392" rx="18"/></clipPath>
  </defs>

  <rect width="1255" height="701" fill="#CBE2F4"/>

  <!-- lampo: l'energia -->
  <path d="M150 292 L120 366 L142 366 L124 424 L178 344 L152 344 L176 292 Z" fill="#1D3A66"/>

  <!-- sole: la luce (i raggi nascono dentro il disco) -->
  <g stroke="#F6B72E" stroke-width="13" stroke-linecap="round">
    <line x1="263" y1="332" x2="263" y2="310"/><line x1="263" y1="384" x2="263" y2="406"/>
    <line x1="237" y1="358" x2="215" y2="358"/><line x1="289" y1="358" x2="311" y2="358"/>
    <line x1="245" y1="340" x2="229" y2="324"/><line x1="281" y1="376" x2="297" y2="392"/>
    <line x1="281" y1="340" x2="297" y2="324"/><line x1="245" y1="376" x2="229" y2="392"/>
  </g>
  <circle cx="263" cy="358" r="30" fill="#F6B72E"/>

  <!-- frecce circolari: la ripetizione -->
  <g stroke="#3D7CC9" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M386.4 338 A40 40 0 0 1 455.6 338"/>
    <path d="M455.6 378 A40 40 0 0 1 386.4 378"/>
  </g>
  <path d="M466.6 357 L465.1 332.5 L446.1 343.5 Z" fill="#3D7CC9"/>
  <path d="M375.4 359 L376.9 383.5 L395.9 372.5 Z" fill="#3D7CC9"/>

  <!-- il nastro RGB che scorre verso la luce -->
  <g stroke-width="19" stroke-linecap="round" fill="none">
    <path d="M740 336 C 810 296, 850 400, 930 358 S 1000 322, 1040 340" stroke="#D95B52"/>
    <path d="M740 355 C 810 315, 850 419, 930 377 S 1000 341, 1040 359" stroke="#4CAE57"/>
    <path d="M740 374 C 810 334, 850 438, 930 396 S 1000 360, 1040 378" stroke="#3C77D6"/>
  </g>

  <!-- la luce bianca in cui sfocia -->
  <circle cx="1046" cy="352" r="165" fill="url(#mv-light)"/>
  <g fill="#FFFFFF" opacity="0.7">
    <path d="M1046 202 L1052 262 L1040 262 Z"/><path d="M1046 502 L1052 442 L1040 442 Z"/>
    <path d="M896 352 L956 346 L956 358 Z"/><path d="M1196 352 L1136 346 L1136 358 Z"/>
    <path d="M940 246 L976 274 L967 283 Z"/><path d="M1152 246 L1116 274 L1125 283 Z"/>
    <path d="M940 458 L976 430 L967 421 Z"/><path d="M1152 458 L1116 430 L1125 421 Z"/>
  </g>
  <circle cx="1046" cy="352" r="88" fill="#FFFFFF"/>

  <!-- il telefono -->
  <rect x="524" y="140" width="208" height="428" rx="30" fill="#EEF0F5"/>
  <rect x="524" y="140" width="208" height="428" rx="30" stroke="#D4D8E2" stroke-width="3"/>
  <rect x="540" y="158" width="176" height="392" rx="18" fill="url(#mv-screen)"/>
  <g clip-path="url(#mv-screenclip)">
    <circle cx="628" cy="330" r="120" fill="url(#mv-glow)"/>
    

    <!-- i tre primari, e le loro somme dipinte come lenti -->
    <circle cx="628" cy="292" r="54" fill="#E03B3B"/>
    <circle cx="601" cy="348" r="54" fill="#2FAE4A"/>
    <circle cx="655" cy="348" r="54" fill="#2F6BE2"/>
    <path d="M574.7 300.8 A54 54 0 0 1 654.3 339.2 A54 54 0 0 1 574.7 300.8 Z" fill="#EFD24F"/>
    <path d="M601.7 339.2 A54 54 0 0 1 681.3 300.8 A54 54 0 0 1 601.7 339.2 Z" fill="#C85BC9"/>
    <path d="M628 301.2 A54 54 0 0 1 628 394.8 A54 54 0 0 1 628 301.2 Z" fill="#46B8CE"/>
    <path d="M654.3 339.2 A54 54 0 0 1 601.7 339.2 A54 54 0 0 1 628 301.2 A54 54 0 0 1 654.3 339.2 Z" fill="#FFFFFF"/>
  </g>
  <rect x="596" y="150" width="64" height="9" rx="4.5" fill="#3A4A63"/>

</svg>
